name: _format probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 输出版本
        run: dart --version && flutter --version
      - name: 格式化
        run: |
          set -euo pipefail
          dart format lib test integration_test test_driver || true
          echo "===== 格式化后差异 ====="
          git --no-pager diff --stat
          git --no-pager diff | head -200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            test/*.dart
            lib/*.dart
            integration_test/*.dart
          retention-days: 1
